<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="styles.css" />

    <title>Frontend Mentor | Social links profile</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <style>
      .attribution {
        font-size: 0.6875rem;
        text-align: center;
      }
      .attribution a {
        color: hsl(228, 45%, 44%);
      }
    </style>
  </head>
  <body>
      <div class="panel">
        <img
          src="assets/images/avatar-jessica.jpeg"
          alt="avatar-photo"
          id="icon"
        />
        <div id="username">Jessica Randall</div>
        <div id="location">London, United Kingdom</div>
        <div id="description">"Front-end developer and avid reader."</div>

        <button class="social-media-btn">GitHub</button>
        <button class="social-media-btn">Frontend Mentor</button>
        <button class="social-media-btn">LinkedIn</button>
        <button class="social-media-btn">Twitter</button>
        <button class="social-media-btn">Instagram</button>
      </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Ismail Emir Koch</a>.
    </footer>
  </body>
</html>
